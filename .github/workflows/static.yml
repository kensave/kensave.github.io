name: Publish engineering portfolio

on:
  push:
    branches: [main]
    paths:
      - portfolio-site.zip
      - .github/workflows/static.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract approved static site
        run: |
          mkdir -p _site
          unzip -q portfolio-site.zip -d _site
          test -f _site/index.html
          test -f _site/world-walker.js
          test -f _site/assets/kenneth-sanchez-resume.pdf
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
